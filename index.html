<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bihana</title>
<meta name="description" content="A sunrise, sun and moon alarm clock for Android.">
<link rel="icon" href="icon.png">
<style>
  :root { color-scheme: light dark; --bg: #fdfaf5; --ink: #1f1a14; --dim: #5d5348; --accent: #b4531f; --rule: #e6ddd0; }
  @media (prefers-color-scheme: dark) { :root { --bg: #14110e; --ink: #efe8dd; --dim: #b5aa9c; --accent: #f0a066; --rule: #3a322a; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 42rem; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 1.9rem; line-height: 1.2; margin: 0 0 12px; }
  h2 { font-size: 1.25rem; margin: 2.2em 0 0.4em; padding-top: 1em; border-top: 1px solid var(--rule); }
  a { color: var(--accent); overflow-wrap: anywhere; }
  em { color: var(--dim); }
  li { margin: 0.35em 0; }
  .app { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; color: inherit; text-decoration: none; font-weight: 600; }
  .app img { width: 48px; height: 48px; border-radius: 12px; }
  footer { margin-top: 48px; color: var(--dim); font-size: 0.9rem; }
</style>
</head>
<body>
<main>
<img src="icon.png" alt="Bihana app icon" width="96" height="96" style="border-radius:22px">
<h1>Bihana</h1>
<p>A sunrise, sun and moon alarm clock for Android, made by Stingfu Private Limited.</p>
<p><a href="privacy.html">Privacy policy</a></p>
<p>Contact: <a href="mailto:bihana.support@gmail.com">bihana.support@gmail.com</a></p>
</main>
</body>
</html>
